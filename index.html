<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockFlow – Interactive Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2333;--mut:#6b7280;--line:#e4e7ec;--pri:#0f766e;--pri2:#0d5f59;--soft:#d9f3ef;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--ok:#15803d;--okbg:#dcfce7;--info:#1d4ed8;--infobg:#dbeafe;--side:#12202b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body.ur{font-family:'Noto Nastaliq Urdu',Inter,sans-serif;line-height:1.9}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:#cbd5df;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;color:#fff;font-weight:700;font-size:16px;padding:4px 8px 14px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pri);display:grid;place-items:center;font-weight:700}
.tn{background:#1c2f3d;border-radius:10px;padding:9px 10px;margin:0 0 12px;font-size:12px}
.tn b{display:block;color:#fff;font-size:13px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#cbd5df;text-decoration:none;cursor:pointer;margin-bottom:1px}
.nav a:hover{background:#1c2f3d}.nav a.on{background:var(--pri);color:#fff}
.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6f8394}
.main{min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .sp{flex:1}
.demo{background:var(--warnbg);color:var(--warn);font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:600}
.sel{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff}
.page{padding:20px 22px 60px;max-width:1280px}
h1{font-size:20px;margin:0 0 3px}.sub{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px;display:block;margin-top:2px}.kpi i{font-style:normal;font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--pri2)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:#f3f4f6}
.btn.s{padding:4px 9px;font-size:12px}.btn.r{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f8fafb}
.num{text-align:end;font-variant-numeric:tabular-nums}
.tw{overflow:auto}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eef0f3;color:#475467}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 13px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:600}
.tabs a.on{color:var(--pri);border-color:var(--pri)}
input[type=text],input[type=number],input[type=date],select.f,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:#fff}
label.l{display:block;font-size:12px;color:var(--mut);margin:0 0 3px;font-weight:600}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{height:7px;background:#eceff2;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar i.w{background:#d97706}.bar i.b{background:var(--bad)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;box-shadow:-8px 0 30px #0003;z-index:20;padding:20px;overflow:auto;transform:translateX(105%);transition:.25s}
body.ur .drawer{inset:0 auto 0 0;transform:translateX(-105%)}
.drawer.open{transform:none}
.veil{position:fixed;inset:0;background:#0006;z-index:19;display:none}.veil.open{display:block}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:#0007;padding:16px}.modal.open{display:grid}
.modal>div{background:#fff;border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12202b;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;display:none}
.tog{position:relative;width:40px;height:22px;background:#cfd5dc;border-radius:99px;cursor:pointer;flex:none;transition:.2s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.tog.on{background:var(--pri)}.tog.on:after{left:21px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f1f4}.mod>div:first-child{flex:1}.mod .tog{flex:none}.mod b{display:block}.mod small{color:var(--mut)}
.note{background:#ecfeff;border:1px solid #a5f3fc;border-radius:10px;padding:11px 13px;color:#155e75}
.pre{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.pre.on{border-color:var(--pri);background:#f0fdfa}
.pre b{display:block}.pre small{color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow:auto}
.kan>div{background:#eef0f3;border-radius:12px;padding:10px;min-height:200px}.kan h4{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between}
.oc{background:#fff;border-radius:9px;padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);font-size:13px}
.phones{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.phone{width:330px;height:660px;border-radius:38px;background:#111;padding:11px;box-shadow:0 14px 40px #0003;flex:none}
.scr{background:#f4f5f7;border-radius:28px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:13px}
.ps{display:flex;justify-content:space-between;padding:8px 18px 2px;font-size:11px;font-weight:600}
.ph{background:var(--pri);color:#fff;padding:10px 14px 14px}.ph b{font-size:16px;display:block}
.pb{flex:1;overflow:auto;padding:12px}
.pn{display:flex;border-top:1px solid var(--line);background:#fff}.pn a{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--mut);cursor:pointer}.pn a.on{color:var(--pri);font-weight:700}
.pc{background:#fff;border-radius:11px;padding:10px 11px;margin-bottom:9px;border:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer}
.inv{font-size:12.5px}.inv table td,.inv table th{padding:5px 6px}
.hide{display:none!important}
.inv2>*{min-width:0}
.tw td input[type=number]{min-width:64px}
.inv2{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:14px}
@media(max-width:900px){.inv2{grid-template-columns:minmax(0,1fr)!important}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}}
</style>
</head>

function qr(seed){let s='';let x=seed*9301+49297;for(let i=0;i<21;i++)for(let j=0;j<21;j++){x=(x*1103515245+12345)&0x7fffffff;const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);if(f||x%3===0)s+=`<rect x="${j*4}" y="${i*4}" width="4" height="4"/>`}return `<svg viewBox="0 0 84 84" width="78" height="78" fill="#111">${s}</svg>`}

function setTenant(k){loadPreset(k);S.page='dash';buildNav();render()}
function setLang(l){S.lang=l;document.body.classList.toggle('ur',l==='ur');document.documentElement.dir=l==='ur'?'rtl':'ltr';buildNav();render()}
function go(p){S.page=p;buildNav();render();window.scrollTo(0,0)}
function buildNav(){
  const p=PRESETS[S.tenant];$('tnName').textContent=p.name;$('tnTag').textContent=p.tag;$('tsel').value=S.tenant;
  $('nav').innerHTML=NAV.map(g=>{const ls=g[1].filter(x=>!x[3]||(x[3]==='app'?(M('salesman')||M('delivery')):M(x[3])));return ls.length?`<h6>${t(g[0])}</h6>`+ls.map(x=>`<a class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24"><path d="${IC[x[1]]}"/></svg>${t(x[2])}</a>`).join(''):''}).join('')
}
function render(){const f=PAGES[S.page];if(!f||(S.page==='schemes'&&!M('schemes'))||(S.page==='field'&&!M('salesman'))||(S.page==='phone'&&!M('salesman')&&!M('delivery'))||(S.page==='orders'&&!M('inord'))||(S.page==='deliv'&&!M('delivery'))){S.page='dash'}$('page').innerHTML=PAGES[S.page]();if(AFTER[S.page])AFTER[S.page]();buildNav()}
const tabs=(key,list,def)=>{const cur=S.tab[key]||def;return `<div class="tabs">${list.map(x=>`<a class="${cur===x[0]?'on':''}" onclick="S.tab['${key}']='${x[0]}';render()">${x[1]}</a>`).join('')}</div>`}
const head=(h,s,btn='')=>`<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><h1>${h}</h1><p class="sub">${s}</p></div><div class="row">${btn}</div></div>`;

function bars(vals,labels,w=520,h=170){const mx=Math.max(...vals);const bw=w/vals.length;return `<svg viewBox="0 0 ${w} ${h+24}" width="100%">${vals.map((v,i)=>{const bh=v/mx*h;return `<rect x="${i*bw+bw*.18}" y="${h-bh}" width="${bw*.64}" height="${bh}" rx="5" fill="var(--pri)" opacity="${i===5?1:.55}"/><text x="${i*bw+bw/2}" y="${h+16}" font-size="11" text-anchor="middle" fill="#6b7280">${labels[i]}</text><text x="${i*bw+bw/2}" y="${h-bh-5}" font-size="10.5" text-anchor="middle" fill="#1b2333">${v}k</text>`}).join('')}</svg>`}

function invoicesBase(){const cs=custs();const nm=S.tenant==='dist'?'AN':S.tenant==='hw'?'KH':'BE';const amts=[84200,36750,152400,9800,64300,118900,27450,73100];return amts.map((a,i)=>{const c=cs[i%cs.length];const st=i%5===3?'Unpaid':i%4===1?'Partial':'Paid';return {no:`${nm}-24${1090-i}`,d:`${5-Math.floor(i/3)} Oct`,c:c.n,a,paid:st==='Paid'?a:st==='Partial'?Math.round(a*.4):0,st,by:M('salesman')?c.sm:M('inord')?'Company order':'Counter',fbr:'FBR-'+(77310+i*13)}})}
function chequesInit(){if(!S.cheques)S.cheques=[['CHQ-884102','Madni Mart','HBL Multan Cantt',150000,'12 Oct','Received'],['CHQ-220918','Haji Younas Kiryana','Meezan Bosan Rd',75000,'08 Oct','Deposited'],['CHQ-551230','Al-Madina Mart','UBL Nawan Shehr',120000,'03 Oct','Bounced'],['CHQ-317702','Chaudhry General Store','Allied Hussain Agahi',90000,'20 Oct','Received'],['PAY-0091','→ '+SUPP[S.tenant][0],'Bank Alfalah',250000,'15 Oct','Issued']].map(x=>({id:x[0],p:x[1],bank:x[2],amt:x[3],due:x[4],st:x[5]}))}
function claimsInit(){if(!S.claims)S.claims=[['Tapal Tea','Buy 5 Ctn get 12 packs · Sep','TP-190',62,31000,'Pending'],['Nestlé Pakistan','Buy 10 Ctn get 1 Ctn · Sep','NE-MP1L',18,71280,'Submitted'],['Shan Foods','3% trade discount · Aug','—',0,46500,'Settled'],['Dalda Foods','Buy 5 Ctn get 6 packs · Sep','DA-1L',22,29040,'Pending'],['Unilever','Display & visibility · Q3','—',0,85000,'Submitted']].map(x=>({co:x[0],sc:x[1],it:x[2],q:x[3],amt:x[4],st:x[5]}))}
function ordersInit(){if(!S.orders){const cs=custs();const it=items();const rows=[[0,'Booked',null],[1,'Booked',null],[2,'Loaded',{co:.6,credit:.4}],[3,'Loaded',{cod:.45,credit:.55}],[4,'Out',{cod:1}],[5,'Out',{co:1}],[6,'Delivered',{cod:1}],[7,'Delivered',{cod:.25,co:.75}]];
 S.orders=rows.map((x,i)=>{const c=cs[x[0]%cs.length];const lines=[0,1,2].map(k=>{const t=it[(i+k)%it.length];return [t.n,(k+2+i%3)+' '+t.pack]});const a=lines.reduce((s,l)=>{const t=it.find(z=>z.n===l[0]);return s+parseInt(l[1])*t.price*t.conv},0);const sp={};if(x[2])Object.entries(x[2]).forEach(([k,f])=>sp[k]=Math.round(a*f));return {no:(S.tenant==='dist'?'CO-':'SO-')+(7710+i),c:c.n,r:c.route.split(' – ')[0],a,st:x[1],sp,inv:x[1]==='Booked'?'':'AN-24'+(1080+i),bal:c.bal,lines}})}}
const cod=o=>o.sp.cod||0;
const payChip=o=>{const e=Object.entries(o.sp).filter(x=>x[1]>0);if(!e.length)return chip('Not invoiced yet','warn');const one=e.length===1;const nm={cod:['Cash on delivery','ok'],credit:['Credit','info'],co:['Paid to company','']};return e.map(([k,v])=>chip(nm[k][0]+(one?'':' '+K(v)),nm[k][1])).join(' ')};

function psEqual(){const P=S.ps,n=P.sel.length,e=Math.floor(P.tot/n);P.amt={cash:0,credit:0,co:0};P.sel.forEach((k,i)=>P.amt[k]=e+(i===0?P.tot-e*n:0))}

function quickInv(){ensureCart();const it=items(),cs=custs();const fo=S.fromOrder!=null?S.orders[S.fromOrder]:null;if(!S.ps)S.ps={sel:fo?['credit']:['cash'],amt:{},tot:undefined};

 <div class="inv2"><div class="card"><div class="fg"><div><label class="l">Customer</label><select class="f" ${fo?'disabled':''} onchange="S.cust=+this.value;quickSync()">${cs.map(c=>`<option value="${c.i}" ${c.i===S.cust?'selected':''}>${c.n}</option>`).join('')}</select></div><div><label class="l">Price list</label><select class="f"><option>Wholesale</option><option>Retail</option></select></div>${M('salesman')?`<div><label class="l">${LB('staff')}</label><select class="f"><option>Imran</option><option>Bilal</option><option>Counter sale</option></select></div>`:''}</div>

 P.sel.forEach(k=>{const n=$('psn_'+k),s=$('pss_'+k);if(n&&document.activeElement!==n)n.value=P.amt[k];if(s){s.max=P.tot;s.value=P.amt[k]}const p=$('psp_'+k);if(p)p.textContent=P.tot?Math.round(P.amt[k]/P.tot*100)+'%':'0%'});
 const sum=P.sel.reduce((s,k)=>s+(P.amt[k]||0),0),ok=sum===P.tot&&P.tot>0;$('psst').innerHTML=ok?`<span style="color:var(--ok)">✓ ${R(sum)} of ${R(P.tot)} allocated</span>`:`<span style="color:var(--bad)">${R(sum)} of ${R(P.tot)} allocated</span>`;
 const credit=P.sel.includes('credit')?P.amt.credit:0;const nb=c.bal+credit;const over=c.lim?nb>c.lim:credit>0;

 :`<div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><small>Pending (not submitted)</small><b>${R(S.claims.filter(c=>c.st==='Pending').reduce((s,c)=>s+c.amt,0))}</b></div><div class="card kpi"><small>Submitted, awaiting payment</small><b>${R(S.claims.filter(c=>c.st==='Submitted').reduce((s,c)=>s+c.amt,0))}</b></div><div class="card kpi"><small>Settled this quarter</small><b>${R(S.claims.filter(c=>c.st==='Settled').reduce((s,c)=>s+c.amt,0))}</b></div></div><div class="card tw"><table><thead><tr><th>Company</th><th>Scheme</th><th class="num">Qty given free</th><th class="num">Claim amount</th><th>Status</th><th></th></tr></thead><tbody>${S.claims.map((c,i)=>`<tr><td><b>${c.co}</b></td><td>${c.sc}</td><td class="num">${c.q?c.q+' packs':'—'}</td><td class="num">${R(c.amt)}</td><td>${chip(c.st,c.st==='Settled'?'ok':c.st==='Submitted'?'info':'warn')}</td><td>${c.st==='Pending'?`<button class="btn g s" onclick="S.claims[${i}].st='Submitted';toast('Claim PDF generated & marked submitted');render()">Submit</button>`:c.st==='Submitted'?`<button class="btn g s" onclick="S.claims[${i}].st='Settled';toast('Credit note recorded in company ledger');render()">Mark settled</button>`:''}</td></tr>`).join('')}</tbody></table></div>`)};

 `<div class="note" style="margin-bottom:12px"><b>Order</b> = a request from a shop; no money or stock moves yet. <b>Convert to invoice</b> opens the invoice with everything filled in. Payment (cash / credit / paid to company) is decided there.</div><div class="card tw"><table><thead><tr><th>Company order</th><th>Shop</th><th>Items</th><th class="num">Order value</th><th>Status</th><th></th></tr></thead><tbody>${S.orders.map((o,i)=>`<tr><td><b>${o.no}</b></td><td>${o.c}<br><small style="color:var(--mut)">${o.r}</small></td><td><small>${o.lines.map(l=>l[0].split(' ').slice(0,2).join(' ')+' × '+l[1]).join(', ')}</small></td><td class="num">${R(o.a)}</td><td>${o.inv?chip('Invoiced','ok'):chip('Received','warn')}</td><td>${o.inv?`<a style="color:var(--pri);cursor:pointer" onclick="invPreview('${o.inv}',${Math.round(o.a*(M('fbr')?1.18:1))},'${o.c.replace(/'/g,"\\'")}')">${o.inv}</a>`:`<button class="btn s" onclick="convertOrder(${i})">Convert to invoice →</button>`}</td></tr>`).join('')}</tbody></table></div>`};
function convertOrder(i){const o=S.orders[i],it=items();S.fromOrder=i;S.cust=Math.max(0,custs().findIndex(c=>c.n===o.c));S.cart=o.lines.map(l=>{const x=it.find(z=>z.n===l[0]);return {c:x.code,u:'p',q:parseInt(l[1])}});S.disc=0;S.ps=null;S.tab.sa='new';go('sales')}

function ofQty(i,v){OF.q[i]=Math.max(0,+v||0);ofSync()}
function ofSync(){const it=items();OF.q.forEach((q,i)=>{$('ofl'+i).textContent=R(q*it[i].price*it[i].conv)});$('oftot').textContent=R(ofTot());$('ofsave').disabled=ofTot()<=0}

 openModal(`<h2 style="margin-top:0">Enter order from company</h2><div class="fg"><div><label class="l">Company order no.</label><input type="text" value="${OF.no}" oninput="OF.no=this.value"></div><div><label class="l">Shop</label><select class="f" onchange="OF.cust=+this.value">${cs.map((c,i)=>`<option value="${i}" ${i===OF.cust?'selected':''}>${c.n}</option>`).join('')}</select></div></div>
 <table style="margin-top:12px"><tr><th>Item</th><th>Qty (${M('units')?'packs':'units'})</th><th class="num">Amount</th></tr>${it.map((x,i)=>`<tr><td>${x.n}</td><td style="width:90px"><input type="number" min="0" value="${OF.q[i]}" oninput="ofQty(${i},this.value)"></td><td class="num" id="ofl${i}"></td></tr>`).join('')}<tr><td colspan="2"><b>Order value</b></td><td class="num"><b id="oftot"></b></td></tr></table>
 <p class="sub" style="margin:10px 0 0">No payment is taken now. It is decided when the order is converted to an invoice.</p>
 <div class="row" style="margin-top:14px"><button class="btn" id="ofsave" onclick="ofSave()">Save order</button><button class="btn g" onclick="closeModal()">Cancel</button></div>`);ofSync()}

 S.orders.unshift({no:OF.no,c:c.n,r:c.route.split(' – ')[0],a:ofTot(),st:'Booked',sp:{},inv:'',bal:c.bal,lines:it.slice(0,3).map((x,i)=>[x.n,OF.q[i]+' '+x.pack])});closeModal();toast('Order saved. Convert it to an invoice when ready.');render()}

 let body='';const tot=()=>Object.entries(p.cart).reduce((s,[k,v])=>s+v*it.find(x=>x.code===k).price*it.find(x=>x.code===k).conv,0);
 if(p.tab==='home')body=`<div class="pc" style="text-align:center"><svg viewBox="0 0 100 100" width="96"><circle cx="50" cy="50" r="40" fill="none" stroke="#e5e7eb" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pri)" stroke-width="10" stroke-dasharray="${.78*251} 251" transform="rotate(-90 50 50)" stroke-linecap="round"/><text x="50" y="56" text-anchor="middle" font-size="18" font-weight="700">78%</text></svg><br><small>Today's target · ${R(400000)}</small></div><div class="row" style="gap:8px"><div class="pc" style="flex:1"><small>Orders</small><br><b style="font-size:18px">18</b></div><div class="pc" style="flex:1"><small>Collected</small><br><b style="font-size:18px">${K(312500)}</b></div></div><div class="pc"><b>Today: Route A (Old City)</b><br><small>28 shops · 14 visited</small></div><button class="btn" style="width:100%" onclick="S.ph.tab='route';phoneRender()">Continue route</button>`;
 else if(p.tab==='route')body=cs.slice(0,6).map((x,i)=>`<div class="pc" onclick="S.ph.shop=${i};S.ph.tab='order';S.ph.cart={};phoneRender()"><div class="row" style="justify-content:space-between"><b>${x.n}</b>${i<2?chip('Visited','ok'):chip(['0.4 km','0.9 km','1.2 km','2 km'][i%4])}</div><small style="color:var(--mut)">${x.area}</small><br><small>Balance <b>${R(x.bal)}</b>${x.bal>x.lim&&x.lim?' · '+'<span style="color:var(--bad)">over limit</span>':''}</small></div>`).join('');
 else if(p.tab==='order')body=`<div class="pc"><b>${c.n}</b><br><small>Balance ${R(c.bal)} · Limit ${R(c.lim)}</small></div>${it.slice(0,5).map(x=>{const q=p.cart[x.code]||0;const fr=x.sch&&M('schemes')?Math.floor(q/x.sch[0])*x.sch[1]:0;return `<div class="pc"><div class="row" style="justify-content:space-between"><div><b>${x.n}</b><br><small>${R(x.price*x.conv)} / ${x.pack}</small>${x.sch&&M('schemes')?`<br>${chip('Buy '+x.sch[0]+', get '+x.sch[1]+' free','ok')}`:''}${fr?`<br><small style="color:var(--ok)">+${fr} free applied</small>`:''}</div><div class="qty"><button onclick="phq('${x.code}',-1)">−</button><b>${q}</b><button onclick="phq('${x.code}',1)">+</button></div></div></div>`}).join('')}<div style="position:sticky;bottom:0;background:#f4f5f7;padding-top:6px"><button class="btn" style="width:100%" onclick="phSave()">Save order · ${R(tot()*(M('fbr')?1.18:1))}</button></div>`;
 else if(p.tab==='collect')body=`<div class="pc"><b>${c.n}</b><br><small>Outstanding ${R(c.bal)}</small></div><label class="l">Amount</label><input type="number" value="25000"><label class="l" style="margin-top:8px">Method</label><select class="f"><option>Cash</option>${M('cheques')?'<option>Cheque</option>':''}<option>JazzCash / Easypaisa</option></select><button class="btn" style="width:100%;margin-top:12px" onclick="p=S.ph;p.pending++;toast('Receipt saved'+(p.offline?' (will sync later)':' & sent on WhatsApp'));phoneRender()">Save & send receipt</button><button class="btn g" style="width:100%;margin-top:8px" onclick="toast('Printing on Bluetooth printer')">Print receipt</button>`;
 else body=`<div class="pc" style="text-align:center"><div style="font-size:30px">${p.offline?'📵':'✅'}</div><b>${p.offline?'Offline mode':'All synced'}</b><br><small>${p.pending} item(s) ${p.offline?'waiting for internet':'uploaded'}</small></div><button class="btn" style="width:100%" ${p.offline?'disabled style="opacity:.5;width:100%"':''} onclick="S.ph.pending=0;toast('Synced to server');phoneRender()">Sync now</button><div class="pc" style="margin-top:10px"><b>End of day</b><br><small>Cash to hand over: ${R(312500)}</small><br><button class="btn g s" style="margin-top:6px" onclick="toast('Day closed')">Close day</button></div>`;
 $('phscr').innerHTML=`<div class="ps"><span>9:41</span><span>${p.offline?'No signal':'4G ▮▮▮'}</span></div><div class="ph"><b>${p.tab==='home'?'Salam, Imran':p.tab==='route'?'Today\'s Route':p.tab==='order'?'Take Order':p.tab==='collect'?'Collect Payment':'Sync'}</b><small>${p.offline?'● Offline · '+p.pending+' pending':'● Online'}</small></div><div class="pb">${body}</div><div class="pn">${[['home','Home'],['route','Route'],['order','Order'],['collect','Collect'],['sync','Sync']].map(x=>`<a class="${p.tab===x[0]?'on':''}" onclick="S.ph.tab='${x[0]}';phoneRender()">${x[1]}</a>`).join('')}</div>`}

 const list=[['profit','Profit by item'],['sales','Sales by customer'],['age','Receivable aging'],['stock','Stock valuation']];
 return head('Reports','Every report can be filtered, exported to Excel / PDF and sent on WhatsApp.',`<button class="btn g" onclick="toast('Exported to Excel')">Export Excel</button><button class="btn g" onclick="toast('PDF ready')">PDF</button>`)+tabs('rp',list,'profit')+
 `<div class="row" style="margin-bottom:12px"><select class="sel"><option>This month</option><option>Last month</option><option>This year</option></select><select class="sel"><option>All categories</option></select>${M('salesman')?'<select class="sel"><option>All salesmen</option></select>':''}</div>`+
 (cur==='profit'?`<div class="card tw"><table><thead><tr><th>Item</th><th class="num">Sold</th><th class="num">Sales</th><th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>${it.map((x,i)=>{const q=Math.round((60-i*7)*k)*x.conv;const s=q*x.price,c=q*x.cost;return `<tr><td><b>${x.n}</b></td><td class="num">${qtyTxt(x,q)}</td><td class="num">${R(s)}</td><td class="num">${R(c)}</td><td class="num"><b>${R(s-c)}</b></td><td class="num">${((s-c)/s*100).toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div>`
 :cur==='sales'?`<div class="card"><h3>Top customers (Rs thousand)</h3>${bars([880,710,640,520,400,310,220].map(v=>Math.round(v*k)),['A','B','C','D','E','F','G'].map((l,i)=>(custs()[i]||{n:l}).n.split(' ')[0]))}</div>`
 :cur==='age'?`<div class="card tw"><table><thead><tr><th>Customer</th><th class="num">0–30</th><th class="num">31–60</th><th class="num">61–90</th><th class="num">90+</th><th class="num">Total</th></tr></thead><tbody>${custs().filter(c=>c.bal).map(c=>`<tr><td>${c.n}</td><td class="num">${K(c.bal*.5)}</td><td class="num">${K(c.bal*.3)}</td><td class="num">${K(c.bal*.15)}</td><td class="num">${K(c.bal*.05)}</td><td class="num"><b>${K(c.bal)}</b></td></tr>`).join('')}</tbody></table></div>`
 :`<div class="card tw"><table><thead><tr><th>Item</th><th>On hand</th><th class="num">Cost value</th><th class="num">Retail value</th></tr></thead><tbody>${it.map(x=>`<tr><td>${x.n}</td><td>${qtyTxt(x,x.stock)}</td><td class="num">${R(x.stock*x.cost)}</td><td class="num">${R(x.stock*x.price)}</td></tr>`).join('')}</tbody></table></div>`)+
 `<div class="grid g4" style="margin-top:14px">${['Daybook','Sales tax (FBR) return','Supplier ledger','Expiry report','Salesman commission','Slow-moving stock'].filter(r=>!(r.includes('FBR')&&!M('fbr'))&&!(r==='Expiry report'&&!M('batch'))&&!(r.includes('Salesman')&&!M('salesman'))).map(r=>`<div class="card cl" style="cursor:pointer" onclick="toast('${r} opens here')"><b>${r}</b><br><small style="color:var(--mut)">More reports →</small></div>`).join('')}</div>`};

/* ---- SETTINGS ---- */
PAGES.set=()=>{const cur=S.tab.st||'mod';
 return head('Settings & Modules','This is how one product fits every business: turn modules on or off, rename terms, add your own fields.')+
 tabs('st',[['mod','Business type & modules'],['term','Terminology'],['cf','Custom fields'],['roles','Users & roles'],['inv','Invoice & tax']],'mod')+
 (cur==='mod'?`<div class="note" style="margin-bottom:14px"><b>1. Pick a starting flavour</b> and it switches on the right modules. <b>2. Fine-tune</b> any toggle below. The menu on the left changes instantly.</div>
  <div class="grid g4" style="margin-bottom:16px">${Object.entries(PRESETS).map(([k,p])=>`<div class="pre ${S.tenant===k?'on':''}" onclick="setTenant('${k}');S.page='set';render()"><b>${p.tag.split(' · ')[0]}</b><small>${Object.values(p.mods).filter(Boolean).length} modules on</small></div>`).join('')}<div class="pre" onclick="toast('Other: pharmacy, general retail, wholesale… (presets are easy to add)')"><b>+ More presets</b><small>Pharmacy, general retail…</small></div></div>
  ${MODS.map(g=>`<div class="card" style="margin-bottom:12px"><h3>${g[0]}</h3>${g[1].map(m=>`<div class="mod"><div><b>${m[1]}</b><small>${m[2]}</small></div><div class="tog ${M(m[0])?'on':''}" onclick="S.mods['${m[0]}']=!S.mods['${m[0]}'];S.cart=null;render()"></div></div>`).join('')}</div>`).join('')}`
 :cur==='term'?`<div class="card"><p class="sub">Rename words to match how this business talks. They update everywhere.</p><div class="fg">${[['supplier','Supplier (singular)'],['suppliers','Suppliers (plural)'],['staff','Sales staff'],['customer','Customer'],['packTitle','Default packing unit']].map(f=>`<div><label class="l">${f[1]}</label><input type="text" value="${LB(f[0])}" oninput="S.labels['${f[0]}']=this.value"></div>`).join('')}</div><button class="btn" style="margin-top:14px" onclick="toast('Saved. Check Purchases & Sales pages.')">Save</button></div>`
 :cur==='cf'?`<div class="card"><p class="sub">Add your own fields to items, customers or invoices. No programming needed.</p><table><tr><th>Applies to</th><th>Field name</th><th>Type</th></tr>${cfields().map(f=>`<tr><td>Items</td><td><b>${f}</b></td><td>Text</td></tr>`).join('')}<tr><td>Customers</td><td><b>NTN / CNIC</b></td><td>Text</td></tr></table><div class="row" style="margin-top:12px"><input type="text" id="ncf" placeholder="New field name" style="max-width:240px"><button class="btn" onclick="if($('ncf').value){cfields().push($('ncf').value);render()}">+ Add field to Items</button></div></div>`
 :cur==='roles'?`<div class="card tw"><table><thead><tr><th>Permission</th><th>Owner</th><th>Manager</th><th>Accountant</th><th>Storekeeper</th>${M('salesman')?'<th>Salesman</th>':'<th>Cashier</th>'}</tr></thead><tbody>${[['See cost & profit',1,1,1,0,0],['Give discount above 5%',1,1,0,0,0],['Edit / delete invoices',1,1,0,0,0],['Adjust stock',1,1,0,1,0],['Receive payments',1,1,1,0,1],['See all customers',1,1,1,0,0],['Close day / cash book',1,1,1,0,0]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td>${v?'✅':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="sub" style="margin:10px 0 0">Custom roles can be created. Every change is stored in the audit log.</p></div>`
 :`<div class="grid g2"><div class="card"><h3>Invoice template</h3><div class="fg"><div><label class="l">Paper</label><select class="f"><option>A4</option><option>A5</option><option>Thermal 80mm</option></select></div><div><label class="l">Language</label><select class="f"><option>English + Urdu</option><option>English</option><option>Urdu</option></select></div></div><div class="row" style="margin-top:10px"><button class="btn g" onclick="invPreview('PREVIEW-1',64300,'Sample Customer')">Preview invoice</button></div></div>${M('fbr')?`<div class="card"><h3>FBR integration</h3><div class="fg"><div><label class="l">NTN</label><input type="text" value="4521987-3"></div><div><label class="l">STRN</label><input type="text" value="17-00-9876-123-45"></div></div><p class="note" style="margin-top:10px">Invoices are reported to FBR in real time and carry the FBR QR code.</p></div>`:'<div class="card"><h3>FBR integration</h3><p class="sub">Turn on the FBR module to enable tax invoices.</p></div>'}</div>`)};

/* ---- PLATFORM ADMIN ---- */
PAGES.plat=()=>head('Platform Admin (SaaS)','For us, not the customer. All businesses run on one system, each with its own data, modules and branding.',`<button class="btn" onclick="newTenant()">+ New business</button>`)+
 `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><small>Active businesses</small><b>3</b></div><div class="card kpi"><small>Users</small><b>41</b></div><div class="card kpi"><small>Monthly revenue</small><b>${R(60000)}</b></div><div class="card kpi"><small>Mobile app installs</small><b>12</b></div></div>
 <div class="card tw"><table><thead><tr><th>Business</th><th>Flavour</th><th>Plan</th><th>Users</th><th>Modules on</th><th>Status</th></tr></thead><tbody>${Object.entries(PRESETS).map(([k,p],i)=>`<tr class="cl" onclick="setTenant('${k}')"><td><b>${p.name}</b><br><small style="color:var(--mut)">${p.city}</small></td><td>${p.tag.split(' · ')[0]}</td><td>${['Business','Starter','Starter'][i]}</td><td>${[18,6,5][i]}</td><td>${Object.entries(p.mods).filter(m=>m[1]).map(m=>chip(m[0])).join(' ')}</td><td>${chip('Active','ok')}</td></tr>`).join('')}</tbody></table></div>
 <p class="note" style="margin-top:14px">One codebase. A new business is a settings choice (flavour + modules + branding), not a new deployment.</p>`;
function newTenant(){openModal(`<h2 style="margin-top:0">New business</h2><div class="fg"><div><label class="l">Business name</label><input type="text" placeholder="e.g. Mian Traders"></div><div><label class="l">Flavour</label><select class="f"><option>Distribution agency</option><option>Hardware store</option><option>Electric store</option><option>Pharmacy</option><option>General retail</option></select></div><div><label class="l">Plan</label><select class="f"><option>Starter</option><option>Business</option></select></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal();toast('Business created with preset modules')">Create</button><button class="btn g" onclick="closeModal()">Cancel</button></div>`)}

/* ---- DRIVER APP (delivery module without salesmen) ---- */
const _phoneSales=PAGES.phone,_prSales=phoneRender;
PAGES.phone=()=>M('salesman')?_phoneSales():head('Driver Mobile App','The van driver sees exactly what to deliver and whether to collect cash. Tap through it like a real phone.')+
 `<div class="phones"><div class="phone"><div class="scr" id="phscr"></div></div><div style="max-width:380px"><div class="card"><h3>What the driver sees</h3><ul style="padding-inline-start:18px;margin:0"><li>Today's deliveries in route order</li><li>A clear banner per order: <b>collect cash Rs X</b> or <b>no cash to collect</b>. Credit and company-paid details stay with the office.</li><li>Mark delivered, report returns or shortages</li><li>Cash collected and end-of-day handover</li><li>Works offline, syncs later</li></ul></div><div class="card" style="margin-top:12px"><h3>Try it</h3><div class="row"><div class="tog ${S.ph.offline?'on':''}" onclick="S.ph.offline=!S.ph.offline;render()"></div><span>Simulate no internet</span></div></div></div></div>`;
phoneRender=function(){if(M('salesman'))return _prSales();ordersInit();const p=S.ph;if(!['home','trip','detail','sync'].includes(p.tab))p.tab='home';
 const mine=S.orders.map((o,i)=>({o,i})).filter(x=>x.o.st==='Loaded'||x.o.st==='Out'||x.o.st==='Delivered');const left=mine.filter(x=>x.o.st!=='Delivered');
 const toCollect=left.reduce((s,x)=>s+cod(x.o),0),got=mine.filter(x=>x.o.st==='Delivered').reduce((s,x)=>s+cod(x.o),0);
 const banner=o=>cod(o)?`<div style="border-radius:9px;padding:9px 10px;font-weight:700;margin:8px 0;background:var(--okbg);color:var(--ok)">COLLECT CASH ${R(cod(o))}</div>`:`<div style="border-radius:9px;padding:9px 10px;font-weight:700;margin:8px 0;background:#eceff2;color:#475467">NO CASH TO COLLECT</div>`;
 let body='',title='Delivery';
 if(p.tab==='home'){title='Salam, Akbar';body=`<div class="pc"><b>Van-2 · Suzuki Ravi</b><br><small>${mine.length} deliveries today · ${left.length} left</small></div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="pc" style="flex:1"><small>Cash to collect</small><br><b style="font-size:17px;color:var(--ok)">${R(toCollect)}</b></div><div class="pc" style="flex:1"><small>Cash collected</small><br><b style="font-size:17px">${R(got)}</b></div></div><div class="pc"><small>The banner on each order tells you if cash is to be collected, and how much.</small></div><button class="btn" style="width:100%" onclick="S.ph.tab='trip';phoneRender()">Start deliveries</button>`}
 else if(p.tab==='trip'){title='Today\'s Deliveries';body=mine.map(x=>`<div class="pc" onclick="S.ph.o=${x.i};S.ph.tab='detail';phoneRender()" style="${x.o.st==='Delivered'?'opacity:.55':''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${x.o.c}</b>${x.o.st==='Delivered'?chip('Done','ok'):''}</div><small style="color:var(--mut)">${x.o.r} · ${x.o.no}</small>${x.o.st==='Delivered'?'':banner(x.o)}</div>`).join('')}
 else if(p.tab==='detail'){const o=S.orders[p.o];title=o.no;body=`<div class="pc"><b>${o.c}</b><br><small>${o.r}</small>${banner(o)}<table style="font-size:12px">${o.lines.map(l=>`<tr><td>${l[0]}</td><td class="num">${l[1]}</td></tr>`).join('')}</table></div>${cod(o)?`<label class="l">Cash received</label><input type="number" value="${cod(o)}">`:''}<button class="btn" style="width:100%;margin-top:10px" onclick="phDeliver()">${o.st==='Delivered'?'Delivered ✓':'Mark delivered'+(cod(o)?' & cash received':'')}</button><button class="btn g" style="width:100%;margin-top:8px" onclick="toast('Return / shortage form: pick item and quantity')">Report return / shortage</button><button class="btn g" style="width:100%;margin-top:8px" onclick="S.ph.tab='trip';phoneRender()">Back</button>`}
 else{title='Sync';body=`<div class="pc" style="text-align:center"><div style="font-size:30px">${p.offline?'📵':'✅'}</div><b>${p.offline?'Offline mode':'All synced'}</b><br><small>${p.pending} item(s) ${p.offline?'waiting for internet':'uploaded'}</small></div><button class="btn" style="width:100%" ${p.offline?'disabled':''} onclick="S.ph.pending=0;toast('Synced to server');phoneRender()">Sync now</button><div class="pc" style="margin-top:10px"><b>End of day</b><br><small>Cash to hand over: ${R(got)}</small><br><button class="btn g s" style="margin-top:6px" onclick="toast('Trip closed. Cash handover recorded.')">Close trip</button></div>`}
 $('phscr').innerHTML=`<div class="ps"><span>9:41</span><span>${p.offline?'No signal':'4G ▮▮▮'}</span></div><div class="ph"><b>${title}</b><small>${p.offline?'● Offline · '+p.pending+' pending':'● Online'}</small></div><div class="pb">${body}</div><div class="pn">${[['home','Home'],['trip','Deliveries'],['sync','Sync']].map(x=>`<a class="${p.tab===x[0]||(x[0]==='trip'&&p.tab==='detail')?'on':''}" onclick="S.ph.tab='${x[0]}';phoneRender()">${x[1]}</a>`).join('')}</div>`};
function phDeliver(){const o=S.orders[S.ph.o];if(o.st!=='Delivered'){o.st='Delivered';S.ph.pending++;toast(cod(o)?'Delivered. '+R(cod(o))+' cash recorded.':'Delivered.')}S.ph.tab='trip';phoneRender()}

/* ---------------- BOOT ---------------- */
loadPreset('dist');buildNav();render();
</script>
</body>
</html>
