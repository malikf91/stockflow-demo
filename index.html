<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockFlow – Interactive Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2333;--mut:#6b7280;--line:#e4e7ec;--pri:#0f766e;--pri2:#0d5f59;--soft:#d9f3ef;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--ok:#15803d;--okbg:#dcfce7;--info:#1d4ed8;--infobg:#dbeafe;--side:#12202b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body.ur{font-family:'Noto Nastaliq Urdu',Inter,sans-serif;line-height:1.9}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:#cbd5df;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:9px;align-items:center;color:#fff;font-weight:700;font-size:16px;padding:4px 8px 14px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pri);display:grid;place-items:center;font-weight:700}
.tn{background:#1c2f3d;border-radius:10px;padding:9px 10px;margin:0 0 12px;font-size:12px}
.tn b{display:block;color:#fff;font-size:13px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#cbd5df;text-decoration:none;cursor:pointer;margin-bottom:1px}
.nav a:hover{background:#1c2f3d}.nav a.on{background:var(--pri);color:#fff}
.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6f8394}
.main{min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top .sp{flex:1}
.demo{background:var(--warnbg);color:var(--warn);font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:600}
.sel{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff}
.page{padding:20px 22px 60px;max-width:1280px}
h1{font-size:20px;margin:0 0 3px}.sub{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px;display:block;margin-top:2px}.kpi i{font-style:normal;font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--pri2)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:#f3f4f6}
.btn.s{padding:4px 9px;font-size:12px}.btn.r{background:var(--bad)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f8fafb}
.num{text-align:end;font-variant-numeric:tabular-nums}
.tw{overflow:auto}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eef0f3;color:#475467}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 13px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:600}
.tabs a.on{color:var(--pri);border-color:var(--pri)}
input[type=text],input[type=number],input[type=date],select.f,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:#fff}
label.l{display:block;font-size:12px;color:var(--mut);margin:0 0 3px;font-weight:600}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{height:7px;background:#eceff2;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar i.w{background:#d97706}.bar i.b{background:var(--bad)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;box-shadow:-8px 0 30px #0003;z-index:20;padding:20px;overflow:auto;transform:translateX(105%);transition:.25s}
body.ur .drawer{inset:0 auto 0 0;transform:translateX(-105%)}
.drawer.open{transform:none}
.veil{position:fixed;inset:0;background:#0006;z-index:19;display:none}.veil.open{display:block}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:#0007;padding:16px}.modal.open{display:grid}
.modal>div{background:#fff;border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12202b;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;display:none}
.tog{position:relative;width:40px;height:22px;background:#cfd5dc;border-radius:99px;cursor:pointer;flex:none;transition:.2s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.tog.on{background:var(--pri)}.tog.on:after{left:21px}
.mod{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f1f4}.mod>div:first-child{flex:1}.mod .tog{flex:none}.mod b{display:block}.mod small{color:var(--mut)}
.note{background:#ecfeff;border:1px solid #a5f3fc;border-radius:10px;padding:11px 13px;color:#155e75}
.pre{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}.pre.on{border-color:var(--pri);background:#f0fdfa}
.pre b{display:block}.pre small{color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow:auto}
.kan>div{background:#eef0f3;border-radius:12px;padding:10px;min-height:200px}.kan h4{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between}
.oc{background:#fff;border-radius:9px;padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);font-size:13px}
.phones{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.phone{width:330px;height:660px;border-radius:38px;background:#111;padding:11px;box-shadow:0 14px 40px #0003;flex:none}
.scr{background:#f4f5f7;border-radius:28px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:13px}
.ps{display:flex;justify-content:space-between;padding:8px 18px 2px;font-size:11px;font-weight:600}
.ph{background:var(--pri);color:#fff;padding:10px 14px 14px}.ph b{font-size:16px;display:block}
.pb{flex:1;overflow:auto;padding:12px}
.pn{display:flex;border-top:1px solid var(--line);background:#fff}.pn a{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--mut);cursor:pointer}.pn a.on{color:var(--pri);font-weight:700}
.pc{background:#fff;border-radius:11px;padding:10px 11px;margin-bottom:9px;border:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer}
.inv{font-size:12.5px}.inv table td,.inv table th{padding:5px 6px}
.hide{display:none!important}
.sbar{margin-bottom:10px}.sbar input{max-width:340px}
.inv2>*{min-width:0}
.tw td input[type=number]{min-width:64px}
.inv2{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:14px}
@media(max-width:900px){.inv2{grid-template-columns:minmax(0,1fr)!important}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}}
</style>
</head>

 return `<div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><small>Total we owe</small><b>${R(tot)}</b></div><div class="card kpi"><small>${LB('suppliers')}</small><b>${sp.length}</b></div></div><div class="card tw"><table><thead><tr><th>${LB('supplier')}</th><th class="num">We owe</th><th>Last purchase</th><th></th></tr></thead><tbody>${sp.map((s,i)=>{const lp=S.purchases.find(p=>p.s===i);return `<tr><td><b>${s}</b></td><td class="num">${R(S.payable[i])}</td><td>${lp?lp.d+' · '+lp.no:'—'}</td><td><button class="btn g s" ${S.payable[i]>0?'':'disabled'} onclick="supPay(${i})">Pay</button></td></tr>`}).join('')}</tbody></table></div>`}
function supPay(i){SP={i,amt:Math.min(S.payable[i],100000),m:'Cash'};openModal(`<h2 style="margin-top:0">Pay ${SUPP[S.tenant][i]}</h2><p class="sub" style="margin:0 0 10px">We owe <b>${R(S.payable[i])}</b></p><div class="fg"><div><label class="l">Amount</label><input type="number" id="sp_amt" value="${SP.amt}" oninput="SP.amt=+this.value;spSync()"></div><div><label class="l">Method</label><select class="f" onchange="SP.m=this.value"><option>Cash</option><option>Bank transfer</option>${M('cheques')?'<option>Cheque</option>':''}</select></div></div><p class="note" id="sp_note" style="margin-top:12px"></p><div class="row" style="margin-top:14px"><button class="btn" id="sp_ok" onclick="supPaySave()">Record payment</button><button class="btn g" onclick="closeModal()">Cancel</button></div>`);spSync()}

function purchForm(){const it=items(),un=M('units');if(!PL||PL.t!==S.tenant)PL={t:S.tenant,l:it.slice(0,3).map((x,i)=>({c:x.code,q:[10,6,20][i],b:0}))};

 <div class="tw" style="margin-top:14px"><table><thead><tr><th>Item</th><th>Qty (${un?'packs':'units'})</th>${M('schemes')?'<th>Free / bonus packs</th>':''}<th class="num">Cost / ${un?'pack':'unit'}</th><th class="num">Amount</th><th></th></tr></thead><tbody>

 <div class="row" style="margin-top:10px"><select class="sel" id="pAdd">${it.map(x=>`<option value="${x.code}">${x.n}</option>`).join('')}</select><button class="btn g s" onclick="PL.l.push({c:$('pAdd').value,q:1,b:0});render()">+ Add item</button></div>
 <div class="card" style="margin-top:14px;background:#f8fafb"><div class="row" style="justify-content:space-between"><span>Total payable</span><b id="ptot" style="font-size:17px"></b></div><div class="row" style="justify-content:space-between;margin-top:8px"><span>Paid now (cash)</span><input type="number" min="0" value="${S.pPaid}" style="width:130px" oninput="S.pPaid=+this.value;purchTot()"></div><p id="pacc" style="margin:10px 0 0;font-size:12.5px"></p>${M('schemes')?`<small style="color:var(--mut)" id="pbon"></small>`:''}</div>

function purchTot(){const it=items(),un=M('units');payInit();let tot=0,bon=0;PL.l.forEach((r,i)=>{const x=it.find(a=>a.code===r.c);const m=un?x.conv:1;const a=r.q*x.cost*m;tot+=a;bon+=r.b*x.cost*m;const e=$('pl'+i);if(e)e.textContent=R(a)});tot=Math.round(tot);const over=(S.pPaid||0)>tot,paid=Math.min(Math.max(0,S.pPaid||0),tot),sup=SUPP[S.tenant][S.pSup];
 $('ptot').textContent=R(tot);$('pacc').innerHTML=!tot?`<span style="color:var(--bad)">Add items with a quantity to continue.</span>`:over?`<span style="color:var(--bad)">Paid now can't be more than the total.</span>`:`Stock goes up now. We owe ${sup}: <b>${R(S.payable[S.pSup])}</b> → after this purchase <b>${R(S.payable[S.pSup]+tot-paid)}</b>.`;
 $('psave').disabled=!tot||over;if($('pbon'))$('pbon').textContent=bon?`Includes ${R(bon)} worth of free goods under company scheme – tracked as claim`:''}

 PL.l.forEach(r=>{const idx=ITEMS[S.tenant].findIndex(a=>a[0]===r.c);const x=it[idx];ITEMS[S.tenant][idx][8]=x.stock+(r.q+r.b)*(un?x.conv:1)});
 S.payable[S.pSup]+=tot-paid;const sup=SUPP[S.tenant][S.pSup];if(paid>0)S.cashTx.push({t:nowT(),txt:'Payment – '+sup,in:0,out:paid});
 const no='GRN-'+(1181+S.purchases.filter(p=>p.neu).length);S.purchases.unshift({no,d:todayD(),s:S.pSup,a:tot,st:'Received',neu:1,lines:PL.l.map(r=>({...r}))});

 <div class="row" style="margin-top:14px"><button class="btn" onclick="recvForm('${c.n.replace(/'/g,"\\'")}')">Receive payment</button><button class="btn g" onclick="toast('Reminder sent on WhatsApp / SMS')">Send reminder</button><button class="btn g" onclick="toast('Statement PDF shared')">Share statement</button></div>`)}

function phoneRender(){const p=S.ph,it=items(),cs=custs();const c=cs[p.shop%cs.length];const T=['home','route','order','collect','sync'];
 let body='';const tot=()=>Object.entries(p.cart).reduce((s,[k,v])=>s+v*it.find(x=>x.code===k).price*it.find(x=>x.code===k).conv,0);
 if(p.tab==='home')body=`<div class="pc" style="text-align:center"><svg viewBox="0 0 100 100" width="96"><circle cx="50" cy="50" r="40" fill="none" stroke="#e5e7eb" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pri)" stroke-width="10" stroke-dasharray="${.78*251} 251" transform="rotate(-90 50 50)" stroke-linecap="round"/><text x="50" y="56" text-anchor="middle" font-size="18" font-weight="700">78%</text></svg><br><small>Today's target · ${R(400000)}</small></div><div class="row" style="gap:8px"><div class="pc" style="flex:1"><small>Orders</small><br><b style="font-size:18px">18</b></div><div class="pc" style="flex:1"><small>Collected</small><br><b style="font-size:18px">${K(312500)}</b></div></div><div class="pc"><b>Today: Route A (Old City)</b><br><small>28 shops · 14 visited</small></div><button class="btn" style="width:100%" onclick="S.ph.tab='route';phoneRender()">Continue route</button>`;
 else if(p.tab==='route')body=cs.slice(0,6).map((x,i)=>`<div class="pc" onclick="S.ph.shop=${i};S.ph.tab='order';S.ph.cart={};phoneRender()"><div class="row" style="justify-content:space-between"><b>${x.n}</b>${i<2?chip('Visited','ok'):chip(['0.4 km','0.9 km','1.2 km','2 km'][i%4])}</div><small style="color:var(--mut)">${x.area}</small><br><small>Balance <b>${R(x.bal)}</b>${x.bal>x.lim&&x.lim?' · '+'<span style="color:var(--bad)">over limit</span>':''}</small></div>`).join('');
 else if(p.tab==='order')body=`<div class="pc"><b>${c.n}</b><br><small>Balance ${R(c.bal)} · Limit ${R(c.lim)}</small></div>${it.slice(0,5).map(x=>{const q=p.cart[x.code]||0;const fr=x.sch&&M('schemes')?Math.floor(q/x.sch[0])*x.sch[1]:0;return `<div class="pc"><div class="row" style="justify-content:space-between"><div><b>${x.n}</b><br><small>${R(x.price*x.conv)} / ${x.pack}</small>${x.sch&&M('schemes')?`<br>${chip('Buy '+x.sch[0]+', get '+x.sch[1]+' free','ok')}`:''}${fr?`<br><small style="color:var(--ok)">+${fr} free applied</small>`:''}</div><div class="qty"><button onclick="phq('${x.code}',-1)">−</button><b>${q}</b><button onclick="phq('${x.code}',1)">+</button></div></div></div>`}).join('')}<div style="position:sticky;bottom:0;background:#f4f5f7;padding-top:6px"><button class="btn" style="width:100%" onclick="phSave()">Save order · ${R(tot()*(M('fbr')?1.18:1))}</button></div>`;
 else if(p.tab==='collect')body=`<div class="pc"><b>${c.n}</b><br><small>Outstanding ${R(c.bal)}</small></div><label class="l">Amount</label><input type="number" value="25000"><label class="l" style="margin-top:8px">Method</label><select class="f"><option>Cash</option>${M('cheques')?'<option>Cheque</option>':''}<option>JazzCash / Easypaisa</option></select><button class="btn" style="width:100%;margin-top:12px" onclick="p=S.ph;p.pending++;toast('Receipt saved'+(p.offline?' (will sync later)':' & sent on WhatsApp'));phoneRender()">Save & send receipt</button><button class="btn g" style="width:100%;margin-top:8px" onclick="toast('Printing on Bluetooth printer')">Print receipt</button>`;
 else body=`<div class="pc" style="text-align:center"><div style="font-size:30px">${p.offline?'📵':'✅'}</div><b>${p.offline?'Offline mode':'All synced'}</b><br><small>${p.pending} item(s) ${p.offline?'waiting for internet':'uploaded'}</small></div><button class="btn" style="width:100%" ${p.offline?'disabled style="opacity:.5;width:100%"':''} onclick="S.ph.pending=0;toast('Synced to server');phoneRender()">Sync now</button><div class="pc" style="margin-top:10px"><b>End of day</b><br><small>Cash to hand over: ${R(312500)}</small><br><button class="btn g s" style="margin-top:6px" onclick="toast('Day closed')">Close day</button></div>`;
 $('phscr').innerHTML=`<div class="ps"><span>9:41</span><span>${p.offline?'No signal':'4G ▮▮▮'}</span></div><div class="ph"><b>${p.tab==='home'?'Salam, Imran':p.tab==='route'?'Today\'s Route':p.tab==='order'?'Take Order':p.tab==='collect'?'Collect Payment':'Sync'}</b><small>${p.offline?'● Offline · '+p.pending+' pending':'● Online'}</small></div><div class="pb">${body}</div><div class="pn">${[['home','Home'],['route','Route'],['order','Order'],['collect','Collect'],['sync','Sync']].map(x=>`<a class="${p.tab===x[0]?'on':''}" onclick="S.ph.tab='${x[0]}';phoneRender()">${x[1]}</a>`).join('')}</div>`}

 `<div class="phones"><div class="phone"><div class="scr" id="phscr"></div></div><div style="max-width:380px"><div class="card"><h3>What the driver sees</h3><ul style="padding-inline-start:18px;margin:0"><li>Today's deliveries in route order</li><li>A clear banner per order: <b>collect cash Rs X</b> or <b>no cash to collect</b>. Credit and company-paid details stay with the office.</li><li>Mark delivered, report returns or shortages</li><li>Cash collected and end-of-day handover</li><li>Works offline, syncs later</li></ul></div><div class="card" style="margin-top:12px"><h3>Try it</h3><div class="row"><div class="tog ${S.ph.offline?'on':''}" onclick="S.ph.offline=!S.ph.offline;render()"></div><span>Simulate no internet</span></div></div></div></div>`;
phoneRender=function(){if(M('salesman'))return _prSales();ordersInit();const p=S.ph;if(!['home','trip','detail','sync'].includes(p.tab))p.tab='home';
 const mine=S.orders.map((o,i)=>({o,i})).filter(x=>x.o.st==='Loaded'||x.o.st==='Out'||x.o.st==='Delivered');const left=mine.filter(x=>x.o.st!=='Delivered');
 const toCollect=left.reduce((s,x)=>s+cod(x.o),0),got=mine.filter(x=>x.o.st==='Delivered').reduce((s,x)=>s+cod(x.o),0);
 const banner=o=>cod(o)?`<div style="border-radius:9px;padding:9px 10px;font-weight:700;margin:8px 0;background:var(--okbg);color:var(--ok)">COLLECT CASH ${R(cod(o))}</div>`:`<div style="border-radius:9px;padding:9px 10px;font-weight:700;margin:8px 0;background:#eceff2;color:#475467">NO CASH TO COLLECT</div>`;
 let body='',title='Delivery';
 if(p.tab==='home'){title='Salam, Akbar';body=`<div class="pc"><b>Van-2 · Suzuki Ravi</b><br><small>${mine.length} deliveries today · ${left.length} left</small></div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="pc" style="flex:1"><small>Cash to collect</small><br><b style="font-size:17px;color:var(--ok)">${R(toCollect)}</b></div><div class="pc" style="flex:1"><small>Cash collected</small><br><b style="font-size:17px">${R(got)}</b></div></div><div class="pc"><small>The banner on each order tells you if cash is to be collected, and how much.</small></div><button class="btn" style="width:100%" onclick="S.ph.tab='trip';phoneRender()">Start deliveries</button>`}
 else if(p.tab==='trip'){title='Today\'s Deliveries';body=mine.map(x=>`<div class="pc" onclick="S.ph.o=${x.i};S.ph.tab='detail';phoneRender()" style="${x.o.st==='Delivered'?'opacity:.55':''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${x.o.c}</b>${x.o.st==='Delivered'?chip('Done','ok'):''}</div><small style="color:var(--mut)">${x.o.r} · ${x.o.no}</small>${x.o.st==='Delivered'?'':banner(x.o)}</div>`).join('')}
 else if(p.tab==='detail'){const o=S.orders[p.o];title=o.no;body=`<div class="pc"><b>${o.c}</b><br><small>${o.r}</small>${banner(o)}<table style="font-size:12px">${o.lines.map(l=>`<tr><td>${l[0]}</td><td class="num">${l[1]}</td></tr>`).join('')}</table></div>${cod(o)?`<label class="l">Cash received</label><input type="number" value="${cod(o)}">`:''}<button class="btn" style="width:100%;margin-top:10px" onclick="phDeliver()">${o.st==='Delivered'?'Delivered ✓':'Mark delivered'+(cod(o)?' & cash received':'')}</button><button class="btn g" style="width:100%;margin-top:8px" onclick="toast('Return / shortage form: pick item and quantity')">Report return / shortage</button><button class="btn g" style="width:100%;margin-top:8px" onclick="S.ph.tab='trip';phoneRender()">Back</button>`}
 else{title='Sync';body=`<div class="pc" style="text-align:center"><div style="font-size:30px">${p.offline?'📵':'✅'}</div><b>${p.offline?'Offline mode':'All synced'}</b><br><small>${p.pending} item(s) ${p.offline?'waiting for internet':'uploaded'}</small></div><button class="btn" style="width:100%" ${p.offline?'disabled':''} onclick="S.ph.pending=0;toast('Synced to server');phoneRender()">Sync now</button><div class="pc" style="margin-top:10px"><b>End of day</b><br><small>Cash to hand over: ${R(got)}</small><br><button class="btn g s" style="margin-top:6px" onclick="toast('Trip closed. Cash handover recorded.')">Close trip</button></div>`}
 $('phscr').innerHTML=`<div class="ps"><span>9:41</span><span>${p.offline?'No signal':'4G ▮▮▮'}</span></div><div class="ph"><b>${title}</b><small>${p.offline?'● Offline · '+p.pending+' pending':'● Online'}</small></div><div class="pb">${body}</div><div class="pn">${[['home','Home'],['trip','Deliveries'],['sync','Sync']].map(x=>`<a class="${p.tab===x[0]||(x[0]==='trip'&&p.tab==='detail')?'on':''}" onclick="S.ph.tab='${x[0]}';phoneRender()">${x[1]}</a>`).join('')}</div>`};
function phDeliver(){const o=S.orders[S.ph.o];if(o.st!=='Delivered'){o.st='Delivered';S.ph.pending++;const amt=cod(o);if(amt>0&&!o.cashDone){o.cashDone=true;S.collected+=amt;S.cashTx.push({t:nowT(),txt:'Delivery cash – '+o.c+' (driver)',in:amt,out:0});const v=(S.extraInv||[]).find(x=>x.no===o.inv);if(v){v.paid+=amt;v.st=v.paid>=v.a?'Paid':'Partial'}}toast(amt?'Delivered. '+R(amt)+' cash collected and recorded.':'Delivered.')}S.ph.tab='trip';phoneRender()}

/* ---- MOBILE APPS: owner app + driver/salesman app ---- */
PAGES.phone=()=>{const second=M('salesman')?'Salesman app':(M('inord')||M('delivery'))?'Driver app':'';faInit();
 return head('Mobile Apps','Tap through them like real phones. They use the same live data as the web app.')+
 `<div class="phones"><div><h3 style="margin:0 0 8px">Owner app</h3><div class="phone"><div class="scr" id="owscr"></div></div><p class="sub" style="max-width:330px;margin-top:10px">The business in your pocket: today's numbers, who owes you, stock lookup, and collecting payments.</p></div>
 ${M('inord')?`<div><h3 style="margin:0 0 8px">Field app · company salesman</h3><div class="phone"><div class="scr" id="fascr"></div></div><p class="sub" style="max-width:330px;margin-top:10px">The company's salesman visits a shop, takes the order, and collects any payment. Orders land in Incoming Orders on the web.</p><div class="row"><div class="tog ${S.fa.offline?'on':''}" onclick="S.fa.offline=!S.fa.offline;render()"></div><span>Simulate no internet</span></div></div>`:''}
 ${second?`<div><h3 style="margin:0 0 8px">${second}</h3><div class="phone"><div class="scr" id="phscr"></div></div><p class="sub" style="max-width:330px;margin-top:10px">${M('salesman')?'Routes, orders and collections for field staff. Works offline.':'The van driver sees what to deliver and how much cash to collect. Works offline.'}</p><div class="row"><div class="tog ${S.ph.offline?'on':''}" onclick="S.ph.offline=!S.ph.offline;render()"></div><span>Simulate no internet</span></div></div>`:''}</div>`};
AFTER.phone=()=>{owRender();if($('fascr'))faRender();if($('phscr'))phoneRender()};
/* ---- Field app (company salesman): take orders + collect payments ---- */
function faInit(){if(!S.fa)S.fa={tab:'shops',shop:null,cart:{},amt:0,m:'Cash',offline:false,queue:[],log:[]}}
function faTab(t){faInit();S.fa.tab=t;S.fa.shop=null;faRender()}
function faQty(code,d){S.fa.cart[code]=Math.max(0,(S.fa.cart[code]||0)+d);faRender()}
function faUnit(x,ci){const c=custs()[ci],up=priceEx(x,c.pl),rl=ruleFor(ci,x.code);const d=rl?(rl.t==='p'?up*rl.v/100:Math.min(rl.v,up)):0;return {up,d,net:up-d,rl}}
function faOrderVal(){const it=items();return Object.entries(S.fa.cart).reduce((s,[k,q])=>{const x=it.find(a=>a.code===k);return s+q*x.conv*faUnit(x,S.fa.shop).net},0)}
function faSaveOrder(){const F=S.fa,c=custs()[F.shop],it=items();const lines=Object.entries(F.cart).filter(([k,q])=>q>0).map(([k,q])=>{const x=it.find(a=>a.code===k);return [x.n,q+' '+x.pack]});if(!lines.length)return toast('Add at least one item');
 ordersInit();const o={no:'CO-'+(7710+S.orders.length+F.queue.filter(x=>x.t==='order').length),c:c.n,r:c.route.split(' – ')[0],a:faOrderVal(),st:'Booked',sp:{},inv:'',bal:c.bal,lines,src:'Field app'};
 if(F.offline){F.queue.push({t:'order',o});toast('Saved on the phone. Will sync when internet is back.')}else{S.orders.unshift(o);toast('Order '+o.no+' sent to the office.')}
 F.log.unshift({k:'order',txt:o.no+' · '+c.n,amt:o.a,pend:F.offline});F.cart={};F.shop=null;F.tab='shops';faRender()}
function faCollect(){const F=S.fa,c=custs()[F.shop],a=Math.round(F.amt);if(!(a>0&&a<=c.bal))return toast('Enter an amount up to '+R(c.bal));
 if(F.offline){F.queue.push({t:'pay',i:F.shop,a,m:F.m});F.log.unshift({k:'pay',txt:'Collected · '+c.n,amt:a,pend:true});toast('Saved on the phone. Will sync when internet is back.')}else{const r=receivePayment(F.shop,a,F.m);F.log.unshift({k:'pay',txt:r.no+' · '+c.n,amt:a,pend:false});toast('Receipt '+r.no+' saved. '+c.n+' now owes '+R(custs()[F.shop].bal))}
 F.shop=null;F.tab='shops';faRender()}
function faSync(){const F=S.fa;if(F.offline)return toast('No internet. Try again when connected.');const n=F.queue.length;F.queue.forEach(q=>{if(q.t==='order'){ordersInit();S.orders.unshift(q.o)}else receivePayment(q.i,q.a,q.m)});F.queue=[];F.log.forEach(l=>l.pend=false);toast(n?n+' item(s) synced to the office.':'Everything is already synced.');faRender()}
function faRender(){faInit();const F=S.fa,cs=custs(),it=items();let body='',title='Salam, Usman',nav=F.tab;
 if(F.tab==='shops'){title='My shops today';body=`<div class="pc" style="background:#f0fdfa"><small>Company salesman · Route A and B</small></div>`+cs.map((c,i)=>`<div class="pc" onclick="S.fa.shop=${i};S.fa.tab='shop';faRender()"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${c.n}</b>${c.od>45?chip('Overdue','bad'):''}</div><small style="color:var(--mut)">${c.area}</small><br><small>Owes <b>${R(c.bal)}</b></small></div>`).join('')}
 else if(F.tab==='shop'){const c=cs[F.shop];title=c.n;nav='shops';body=`<div class="pc"><small>${c.area}</small><br><small>Owes</small> <b style="font-size:20px">${R(c.bal)}</b><br><small>Credit limit ${c.lim?R(c.lim):'—'}</small>${c.lim?`<div class="bar" style="margin-top:6px"><i class="${c.bal>c.lim?'b':''}" style="width:${Math.min(100,c.bal/c.lim*100)}%"></i></div>`:''}</div><button class="btn" style="width:100%;margin-bottom:8px" onclick="S.fa.cart={};S.fa.q='';S.fa.f=0;S.fa.tab='order';faRender()">Take order</button><button class="btn g" style="width:100%;margin-bottom:8px" onclick="S.fa.amt=Math.min(${c.bal},25000);S.fa.m='Cash';S.fa.tab='collect';faRender()" ${c.bal>0?'':'disabled'}>Collect payment</button><button class="btn g" style="width:100%" onclick="S.fa.shop=null;S.fa.tab='shops';faRender()">Back</button>`}
 else if(F.tab==='order'){const c=cs[F.shop];title='Order · '+c.n;nav='shops';const v=faOrderVal();const q=(F.q||'').toLowerCase();const list=it.filter(x=>(c.pl==='horeca'?x.hx:x.tp)&&x.n.toLowerCase().includes(q));body=`<input type="text" id="fa_q" placeholder="🔍 Search item" value="${F.q||''}" style="margin-bottom:8px" onfocus="S.fa.f=1" oninput="S.fa.q=this.value;faRender()"><div style="margin-bottom:8px">${chip(c.pl==='horeca'?'HORECA price list':'Retail price list','info')}</div>`+list.map(x=>{const u=faUnit(x,F.shop),qq=F.cart[x.code]||0;return `<div class="pc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><b>${x.n}</b><br><small>${u.d?`<s style="color:var(--mut)">${R2(u.up*x.conv)}</s> `:''}<b>${R2(u.net*x.conv)}</b> / ${x.pack} <span style="color:var(--mut)">excl. tax</span></small>${u.rl?`<br>${chip('Your rate: −'+ruleTxt(u.rl),'ok')}`:''}</div><div class="qty"><button onclick="faQty('${x.code}',-1)">−</button><b>${qq}</b><button onclick="faQty('${x.code}',1)">+</button></div></div></div>`}).join('')+`<div style="position:sticky;bottom:0;background:#f4f5f7;padding-top:6px"><button class="btn" style="width:100%" onclick="faSaveOrder()">Save order · ${R(v)}</button><button class="btn g" style="width:100%;margin-top:6px" onclick="S.fa.tab='shop';faRender()">Back</button></div>`} else if(F.tab==='collect'){const c=cs[F.shop];title='Collect · '+c.n;nav='shops';body=`<div class="pc"><small>Outstanding</small><br><b style="font-size:20px">${R(c.bal)}</b></div><label class="l">Amount received</label><input type="number" value="${F.amt}" oninput="S.fa.amt=+this.value"><label class="l" style="margin-top:8px">Method</label><select class="f" onchange="S.fa.m=this.value"><option>Cash</option><option>Bank transfer / Raast</option><option>JazzCash / Easypaisa</option></select><button class="btn" style="width:100%;margin-top:12px" onclick="faCollect()">Save & send receipt</button><button class="btn g" style="width:100%;margin-top:8px" onclick="S.fa.tab='shop';faRender()">Back</button>`}
 else if(F.tab==='today'){title='Today';const oc=F.log.filter(l=>l.k==='order'),pc=F.log.filter(l=>l.k==='pay');body=`<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="pc" style="flex:1"><small>Orders taken</small><br><b style="font-size:16px">${oc.length}</b><br><small>${R(oc.reduce((s,l)=>s+l.amt,0))}</small></div><div class="pc" style="flex:1"><small>Collected</small><br><b style="font-size:16px">${R(pc.reduce((s,l)=>s+l.amt,0))}</b><br><small>${pc.length} receipt(s)</small></div></div>`+(F.log.length?F.log.map(l=>`<div class="pc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${l.k==='order'?'Order':'Payment'}</b>${l.pend?chip('Pending sync','warn'):chip('Synced','ok')}</div><small>${l.txt}</small><br><b>${R(l.amt)}</b></div>`).join(''):'<div class="pc"><small>Nothing yet. Open a shop to take an order or collect a payment.</small></div>')}
 else{title='Sync';body=`<div class="pc" style="text-align:center"><div style="font-size:30px">${F.offline?'📵':'✅'}</div><b>${F.offline?'Offline mode':F.queue.length?'Ready to sync':'All synced'}</b><br><small>${F.queue.length} item(s) ${F.offline?'saved on the phone':'waiting'}</small></div><button class="btn" style="width:100%" ${F.offline?'disabled':''} onclick="faSync()">Sync now</button><div class="pc" style="margin-top:10px"><small>Orders and payments taken without internet are kept safely on the phone and sent to the office when you are back online.</small></div>`}
 $('fascr').innerHTML=`<div class="ps"><span>9:41</span><span>${F.offline?'No signal':'4G ▮▮▮'}</span></div><div class="ph"><b>${title}</b><small>${F.offline?'● Offline · '+F.queue.length+' pending':'● Online'}</small></div><div class="pb">${body}</div><div class="pn">${[['shops','Shops'],['today','Today'],['sync','Sync']].map(x=>`<a class="${nav===x[0]?'on':''}" onclick="faTab('${x[0]}')">${x[1]}</a>`).join('')}</div>`;const fe=$('fa_q');if(fe&&F.f){fe.focus();fe.setSelectionRange(fe.value.length,fe.value.length)}}
function owTab(t){S.ow.tab=t;S.ow.q='';S.ow.f=0;S.ow.cust=null;owRender()}
function owReceive(){const o=S.ow,c=custs()[o.cust],a=Math.round(o.amt);if(!(a>0&&a<=c.bal))return toast('Enter an amount up to '+R(c.bal));const r=receivePayment(o.cust,a,o.m);const nb=custs()[o.cust].bal;o.cust=null;owRender();toast('Receipt '+r.no+' saved. '+c.n+' now owes '+R(nb))}
function owRender(){const o=S.ow,m=metrics(),it=m.it,cs=m.cs;if(!['home','khata','stock','orders'].includes(o.tab))o.tab='home';const q=(o.q||'').toLowerCase();let body='',title=PRESETS[S.tenant].name;
 const srch=ph=>`<input type="text" id="ow_q" placeholder="🔍 ${ph}" value="${o.q||''}" style="margin-bottom:10px" onfocus="S.ow.f=1" oninput="S.ow.q=this.value;owRender()">`;
 if(o.tab==='home'){const v=[...SALES7[S.tenant].slice(0,6),Math.round(m.sales/1000)],mx=Math.max(...v),dl=last7();let wait='';if(M('inord')){ordersInit();wait=` · ${S.orders.filter(x=>!x.inv).length} order(s) to invoice · Rs ${K(S.orders.filter(x=>x.inv&&x.st!=='Delivered').reduce((a,x)=>a+cod(x),0))} cash with drivers`}
  const kp=(l,v)=>`<div class="pc" style="flex:1"><small>${l}</small><br><b style="font-size:16px">Rs ${K(v)}</b></div>`;title='Good morning';
  body=`<div class="row" style="gap:8px;flex-wrap:nowrap">${kp('Sales today',m.sales)}${kp('Collected today',m.cash)}</div><div class="row" style="gap:8px;flex-wrap:nowrap">${kp('Khata (udhaar)',m.rec)}${kp('We owe',m.pay)}</div><div class="pc"><small>Last 7 days</small><div style="display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:6px">${v.map((x,i)=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(x/mx*60)}px;background:var(--pri);opacity:${i===6?1:.5};border-radius:4px"></div><small style="font-size:9px;color:var(--mut)">${dl[i].slice(0,2)}</small></div>`).join('')}</div></div><div class="pc"><b>Needs attention</b><br><small>${m.over.length} over credit limit · ${m.low.length} low on stock${wait}</small></div>`}
 else if(o.tab==='khata'&&o.cust!=null){const c=cs[o.cust];title=c.n;body=`<div class="pc"><small>Outstanding</small><br><b style="font-size:20px">${R(c.bal)}</b><br><small>Credit limit ${c.lim?R(c.lim):'—'}</small>${c.lim?`<div class="bar" style="margin-top:6px"><i class="${c.bal>c.lim?'b':''}" style="width:${Math.min(100,c.bal/c.lim*100)}%"></i></div>`:''}</div><label class="l">Amount received</label><input type="number" value="${o.amt}" oninput="S.ow.amt=+this.value"><label class="l" style="margin-top:8px">Method</label><select class="f" onchange="S.ow.m=this.value"><option>Cash</option><option>Bank transfer / Raast</option><option>JazzCash / Easypaisa</option></select><button class="btn" style="width:100%;margin-top:12px" onclick="owReceive()">Receive payment</button><button class="btn g" style="width:100%;margin-top:8px" onclick="S.ow.cust=null;owRender()">Back</button>`}
 else if(o.tab==='khata'){title='Khata · who owes you';const list=cs.filter(c=>c.bal>0&&c.n.toLowerCase().includes(q)).sort((a,b)=>b.bal-a.bal);body=srch('Search shop / customer')+(list.length?list.map(c=>`<div class="pc" onclick="S.ow.cust=${c.i};S.ow.amt=Math.min(${c.bal},25000);S.ow.m='Cash';owRender()"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${c.n}</b><b>${R(c.bal)}</b></div><small style="color:var(--mut)">${c.area}</small>${c.od>30?' '+chip(c.od+' days','bad'):''}</div>`).join(''):'<div class="pc"><small>No outstanding balances.</small></div>')}
 else if(o.tab==='stock'){title='Stock';body=srch('Search item')+it.filter(x=>x.n.toLowerCase().includes(q)).map(x=>`<div class="pc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${x.n}</b>${x.stock<x.re?chip('Low','bad'):chip('OK','ok')}</div><small>${qtyTxt(x,x.stock)}</small></div>`).join('')}
 else if(M('inord')){title='Orders';ordersInit();body=S.orders.map(x=>`<div class="pc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${x.no}</b>${x.inv?chip('Invoiced','ok'):chip('Received','warn')}</div><small>${x.c}</small><br><b>${R(x.a)}</b></div>`).join('')}
 else{title='Recent sales';body=invoices().slice(0,8).map(v=>`<div class="pc"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${v.no}</b>${chip(v.st,v.st==='Paid'?'ok':(v.st==='Partial'||v.st==='COD pending')?'warn':'bad')}</div><small>${v.c}</small><br><b>${R(v.a)}</b></div>`).join('')}
 const tl=M('inord')?'Orders':'Sales';
 $('owscr').innerHTML=`<div class="ps"><span>9:41</span><span>4G ▮▮▮</span></div><div class="ph"><b>${title}</b><small>● Online</small></div><div class="pb">${body}</div><div class="pn">${[['home','Home'],['khata','Khata'],['stock','Stock'],['orders',tl]].map(x=>`<a class="${o.tab===x[0]?'on':''}" onclick="owTab('${x[0]}')">${x[1]}</a>`).join('')}</div>`;
 const e=$('ow_q');if(e&&o.f){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}

/* ---------------- BOOT ---------------- */
loadPreset('dist');if(!ADMIN){$('tsel').style.display='none';$('tsel').previousElementSibling.style.display='none'}buildNav();render();
</script>
